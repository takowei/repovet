name = "repovet-webhook-verify"
main = "worker.js"
compatibility_date = "2026-07-01"

# No routes/custom domain block on purpose -- deploying with this config
# alone publishes to the free *.workers.dev subdomain.
# `GITHUB_WEBHOOK_SECRET` is a secret, not a var: set it with
#   npx wrangler secret put GITHUB_WEBHOOK_SECRET
# so it never lands in this file or git history.
